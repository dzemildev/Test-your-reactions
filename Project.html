<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"> 
    <title>Test your reactions</title>
    <style>


        
        body{

            justify-content: center;
            align-items: center;
            text-align: center;
            background-image: url("back\ copy.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment:fixed;


        }

    
        #shape{
            width: 100px;
            height: 100px;
            background-color: red;
            
            display: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        .bold{
            font-weight: bold;
        }
        .text{
            background-color: rgb(129, 164, 230);
            margin: auto;;
            width: 50%;
            border: 7px solid green;

            border-style: dotted;
        }

        .shape{
            
            width: 1000px;

            height: 700px;
            border: 3px solid green;
            border: 2px solid black;
            border-style: dotted;
            border: 2px solid black;
            margin: 20px auto;
            background-color: RGBa(0, 155, 119, 0.5);
            display: block;
            position: relative;
            border: 2px solid black;
            overflow: hidden
        }
    </style>

</head>
<body>
    <div class="text">
    <h1>Test your reactions</h1>
    <p>Hello this game test your reactions reflex. Every time when you see objects click it.</p>
    <p>Your time is:<span id="time" class="bold"></span></p>
    </div>
    
    <div class="shape">
    <div id="shape" class=""></div>

    </div>

    <script>
        
        
        let start = new Date().getTime();

        function makeShapeAppear() {
            let top = Math.random() * 700;
            let left = Math.random() * 1000;
            document.getElementById("shape").style.top = top + "px";
            document.getElementById("shape").style.left = left + "px";
            document.getElementById("shape").style.display = "block";
            start = new Date().getTime();
            

        }

        function apearAfterDelay() {

        
        setTimeout(makeShapeAppear, Math.random() + 1500);

        }
        apearAfterDelay()
        document.getElementById("shape").onclick = function() {
            

            document.getElementById("shape").style.display = "none";

            let end = new Date().getTime();

            let timeTaken = end - start;

            document.getElementById("time").innerHTML = " " + timeTaken + "ms";
            apearAfterDelay()

            
        }
  
    </script>
</body>
</html>
